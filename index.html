<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#07111c"/>
<meta name="description" content="AI Agent Workspace — interactive operations office."/>
<title>AI Agent Workspace</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07111c;color:#e6f1ff;font-family:Arial,Helvetica,sans-serif}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#102b42 0,#07111c 55%,#03080d 100%);z-index:9999}
.boot-card{width:min(720px,calc(100% - 40px));padding:28px;border:1px solid #29445c;border-radius:18px;background:rgba(7,17,28,.94);box-shadow:0 20px 70px rgba(0,0,0,.45)}
.boot-title{font-size:22px;font-weight:800;letter-spacing:1px}.boot-sub{margin-top:8px;color:#8fa8bd}.boot-status{margin-top:20px;color:#62e6a8}.boot-error{margin-top:16px;padding:12px;border-radius:10px;background:#24151b;color:#ff9eaa;white-space:pre-wrap;display:none;font-size:13px}
#root{width:100%;height:100%}
</style>
</head>
<body>
<div id="boot"><div class="boot-card"><div class="boot-title">✦ AI AGENT WORKSPACE</div><div class="boot-sub">Starting the GitHub-native operations console…</div><div id="boot-status" class="boot-status">Loading application…</div><div id="boot-error" class="boot-error"></div></div></div>
<div id="root"></div>
<script>
(function(){
 const boot=document.getElementById("boot"), status=document.getElementById("boot-status"), error=document.getElementById("boot-error");
 function showError(label,detail){
   status.textContent="Application startup error";
   error.style.display="block";
   error.textContent=label+(detail?"\n\n"+detail:"");
 }
 window.addEventListener("error",function(e){showError("JavaScript error",e.message+"\n"+(e.filename||"")+" : "+(e.lineno||"")+":"+(e.colno||""));});
 window.addEventListener("unhandledrejection",function(e){showError("Unhandled promise rejection",String(e.reason&&e.reason.stack||e.reason));});
 window.addEventListener("agent-app-ready",function(){boot.style.display="none";});
 setTimeout(function(){if(boot.style.display!=="none"&& !error.textContent){status.textContent="Still loading… If this remains, the diagnostic panel will identify the problem."; }},4000);
})();
</script>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
