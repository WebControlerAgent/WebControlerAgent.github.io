name: Deploy AIWCU Universe to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build AIWCU Universe
        run: npm run build

      - name: Force GitHub Pages to use Actions publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT repos/${GITHUB_REPOSITORY}/pages \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow \
            -f "source[branch]=main" \
            -f "source[path]=/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Allow Pages artifact to finalize
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Retry GitHub Pages deployment
        if: failure()
        uses: actions/deploy-pages@v4
