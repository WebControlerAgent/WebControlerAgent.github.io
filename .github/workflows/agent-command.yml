name: Agent Runtime Command

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      command:
        description: JSON runtime command
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: agent-runtime-command
  cancel-in-progress: false

jobs:
  command:
    if: github.event.issue.user.login == 'WebControlerAgent' && startsWith(github.event.issue.title, '[Agent Runtime]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse command
        env:
          DISPATCH_COMMAND: ${{ inputs.command }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' "$DISPATCH_COMMAND" > /tmp/runtime-command.json
          else
            python3 controller/issue_command.py > /tmp/runtime-command.json
          fi

      - name: Apply runtime command
        run: |
          python3 - <<'PY'
          import json, subprocess
          c=json.load(open('/tmp/runtime-command.json'))
          args=['python3','controller/dispatch.py','--action',c['action']]
          for k in ('site','agent','task','passed','error'):
              args += ['--'+k,str(c.get(k,''))]
          subprocess.run(args,check=True)
          PY

      - name: Run autonomous pipeline in this GitHub job
        run: |
          set -u
          action=$(python3 -c 'import json;print(json.load(open("/tmp/runtime-command.json"))["action"])')
          site=$(python3 -c 'import json;print(json.load(open("/tmp/runtime-command.json")).get("site",""))')

          if [ "$action" != "claim" ] || [ -z "$site" ]; then
            echo "No autonomous pipeline required for action=$action"
            exit 0
          fi

          for i in 1 2 3 4 5 6 7 8 9; do
            echo "=== Agent pipeline step $i ==="

            echo "--- Live verification gate ---"
            python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "controller")
          from agent_checks import run_checks

          root=Path(".")
          state_path=root/"controller/agent_state.json"
          sites_path=root/"controller/sites.json"
          status_path=root/"public/status.json"
          state=json.loads(state_path.read_text())
          active=state.get("active_site")
          if not active:
              raise SystemExit(0)

          site_id=active.get("id")
          sites=json.loads(sites_path.read_text()).get("sites", [])
          site=next((s for s in sites if s.get("id")==site_id), None)
          if not site:
              raise SystemExit("Unknown active site: "+str(site_id))

          flow=active.get("flow", [])
          idx=int(active.get("pipeline_index", 0))
          agent=flow[idx] if idx < len(flow) else None
          if agent not in {"researcher", "publisher", "seo-agent", "qa"}:
              print("No external live check required for agent="+str(agent))
              raise SystemExit(0)

          ok, detail=run_checks(site, agent)
          state.setdefault("events", []).append({
              "type":"live_check", "agent":agent, "site":site_id,
              "passed":ok, "detail":detail
          })
          state.setdefault("agent_states", {}).setdefault(agent, {})["live_check"]={
              "passed":ok, "detail":detail
          }

          if not ok:
              active["state"]="REPAIRING"
              active["failed_agent"]=agent
              active["error"]=detail
              active["retries"]=int(active.get("retries", 0))+1
              active["flow"]=["bug-hunter", "bug-solver", "qa"]
              active["pipeline_index"]=0
              state["agent_states"][agent]["state"]="FAILED"
              print("LIVE CHECK FAILED: "+detail)
          else:
              print("LIVE CHECK PASSED: "+detail)

          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False)+"\\n")
          status=json.loads(status_path.read_text()) if status_path.exists() else {}
          status["agent_runtime"]=state
          status["live_check"]={"site":site_id, "agent":agent, "passed":ok, "detail":detail}
          status_path.write_text(json.dumps(status, indent=2, ensure_ascii=False)+"\\n")
          raise SystemExit(0 if ok else 2)
          PY
            gate_rc=$?
            if [ "$gate_rc" -eq 2 ]; then
              echo "Live check failed; repair flow selected."
            elif [ "$gate_rc" -ne 0 ]; then
              exit "$gate_rc"
            fi
            set +e
            python3 controller/agent_worker.py "$site"
            rc=$?
            set -e

            active=$(python3 -c 'import json; s=json.load(open("controller/agent_state.json")); print(bool(s.get("active_site")))')
            retries=$(python3 -c 'import json; s=json.load(open("controller/agent_state.json")); a=s.get("active_site") or {}; print(int(a.get("retries",0)))')

            echo "worker_exit=$rc active_site=$active retries=$retries"

            if [ "$retries" -gt 3 ]; then
              echo "Retry limit exceeded."
              exit 1
            fi

            if [ "$active" != "True" ]; then
              echo "Agent pipeline completed."
              exit 0
            fi
          done

          echo "Agent pipeline did not finish within the allowed steps."
          exit 1

      - name: Persist final runtime state
        if: always()
        run: |
          git config user.name 'Web Controller Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controller/agent_state.json public/status.json
          git diff --cached --quiet || git commit -m 'chore: persist autonomous agent pipeline state'
          git push

      - name: Report result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment '${{ github.event.issue.number }}' --body '✅ **Agent Runtime command completed successfully.** The autonomous pipeline finished in GitHub Actions.'
          else
            gh issue comment '${{ github.event.issue.number }}' --body '❌ **Agent Runtime command failed.** Runtime state and diagnostics were persisted in the repository.'
          fi
          gh issue close '${{ github.event.issue.number }}'
