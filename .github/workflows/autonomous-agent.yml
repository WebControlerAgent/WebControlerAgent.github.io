name: Autonomous Agent Run
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Enabled authorized target id"
        required: true
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: autonomous-agent-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run agent pipeline
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3 4 5 6 7 8 9; do
            python3 controller/agent_worker.py "${{ inputs.site }}"
            if [ ! -f controller/agent_state.json ]; then break; fi
            active=$(python3 -c 'import json; s=json.load(open("controller/agent_state.json")); print(bool(s.get("active_site")))')
            if [ "$active" != "True" ]; then break; fi
          done

      - name: Commit runtime state
        run: |
          git config user.name "Web Controller Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/agent_state.json public/status.json
          git diff --cached --quiet || git commit -m "chore: run autonomous agent pipeline"
          git push
      - name: Build workspace
        run: |
          npm install
          npm run build