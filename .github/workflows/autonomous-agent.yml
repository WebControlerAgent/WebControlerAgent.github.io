name: Autonomous Agent Run
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Enabled authorized site id"
        required: true
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: autonomous-agent-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime
        run: python3 controller/verify_runtime.py
      - name: Run sequential pipeline
        run: |
          set -e
          for i in 1 2 3 4 5 6 7 8 9; do
            python3 controller/agent_worker.py "${{ inputs.site }}" || exit 1
            active=$(python3 -c 'import json; print(bool(json.load(open("controller/agent_state.json")).get("active_site")))')
            if [ "$active" != "True" ]; then exit 0; fi
          done
          echo "Agent pipeline did not finish within the allowed steps."
          exit 1
      - name: Persist runtime state
        if: always()
        run: |
          git config user.name "Web Controller Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/agent_state.json public/status.json
          git diff --cached --quiet || git commit -m "chore: persist agent runtime state"
          git push
