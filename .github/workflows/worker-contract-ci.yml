name: Worker contract checks

on:
  push:
    branches: [main]
    paths:
      - "controller/worker_contract.py"
      - "controller/task_dispatcher.py"
      - "controller/worker_queue.py"
      - "tests/worker_contract/**"
      - ".github/workflows/worker-contract-ci.yml"
  pull_request:
    paths:
      - "controller/worker_contract.py"
      - "controller/task_dispatcher.py"
      - "controller/worker_queue.py"
      - "tests/worker_contract/**"
      - ".github/workflows/worker-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run worker contract and queue tests
        run: python -m unittest discover -s tests/worker_contract -p 'test_*.py' -v
