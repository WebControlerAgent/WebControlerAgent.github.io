name: Bounded AI Worker (Patch Only)

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: "Repository task JSON path (must be inside tasks/)"
        required: true
        default: "tasks/demo-ui-review.json"
        type: string
      timeout_minutes:
        description: "Hard time limit (5–20 minutes)"
        required: true
        default: "15"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "20"

permissions:
  contents: read

concurrency:
  group: bounded-ai-worker
  cancel-in-progress: false

jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate task file path and authorized target
        id: task
        shell: bash
        env:
          TASK_FILE: ${{ inputs.task_file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = os.environ["TASK_FILE"]
          if not re.fullmatch(r"tasks/[A-Za-z0-9._-]+\.json", p) or ".." in p:
              raise SystemExit("BLOCKED: task_file must be a simple JSON filename inside tasks/.")
          task_path = Path(p)
          if not task_path.is_file():
              raise SystemExit("BLOCKED: task file does not exist.")
          task = json.loads(task_path.read_text(encoding="utf-8"))
          sites = json.loads(Path("controller/sites.json").read_text(encoding="utf-8"))
          required = ("task_id", "site", "repository", "parent_captain", "task_type", "objective", "allowed_paths", "constraints", "success_criteria")
          missing = [k for k in required if task.get(k) in (None, "", [])]
          if missing:
              raise SystemExit("BLOCKED: missing required fields: " + ", ".join(missing))
          matches = [s for s in sites.get("sites", []) if s.get("id") == task["site"] and s.get("enabled") is True and s.get("authorized") is True]
          if len(matches) != 1:
              raise SystemExit("BLOCKED: site is not uniquely enabled and authorized.")
          if task["repository"] != matches[0].get("repository"):
              raise SystemExit("BLOCKED: task repository does not match the authorized site registry.")
          if not isinstance(task["allowed_paths"], list) or not task["allowed_paths"] or len(task["allowed_paths"]) > 40:
              raise SystemExit("BLOCKED: allowed_paths must contain 1–40 entries.")
          if not isinstance(task["success_criteria"], list) or not task["success_criteria"]:
              raise SystemExit("BLOCKED: success_criteria must be a non-empty list.")
          if task["task_type"] not in ("bug_fix", "code_change_proposal"):
              raise SystemExit("BLOCKED: only bug_fix/code_change_proposal tasks may enter this coding worker.")
          repo = task["repository"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit("BLOCKED: malformed repository name.")
          print("task_id=" + str(task["task_id"]))
          print("Authorized task contract validated. No source files have been changed.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("repository=" + repo + "\n")
              out.write("task_id=" + re.sub(r"[^A-Za-z0-9_.-]", "-", str(task["task_id"]))[:80] + "\n")
              out.write("task_file=" + p + "\n")
          PY

      - name: Check worker runtime configuration
        env:
          MINI_SWE_AGENT_BIN: ${{ vars.MINI_SWE_AGENT_BIN }}
          MINI_SWE_AGENT_SANDBOX: ${{ vars.MINI_SWE_AGENT_SANDBOX }}
          MINI_SWE_AGENT_IMAGE: ${{ vars.MINI_SWE_AGENT_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          command -v docker >/dev/null || { echo "::error::Docker is not available on this runner."; exit 1; }
          test -n "$MINI_SWE_AGENT_BIN" || { echo "::error::Set repository variable MINI_SWE_AGENT_BIN to the installed mini-SWE-agent CLI executable."; exit 1; }
          test "$MINI_SWE_AGENT_SANDBOX" = "docker" || { echo "::error::Set repository variable MINI_SWE_AGENT_SANDBOX=docker."; exit 1; }
          test -n "$MINI_SWE_AGENT_IMAGE" || { echo "::error::Set repository variable MINI_SWE_AGENT_IMAGE to a reviewed worker image."; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY secret is missing."; exit 1; }
          test -n "$CROSS_REPO_TOKEN" || { echo "::error::CROSS_REPO_TOKEN secret is missing or lacks target-repository read access."; exit 1; }
          python3 -m pip install --user mini-swe-agent
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          docker pull "$MINI_SWE_AGENT_IMAGE"

      - name: Checkout authorized target repository into isolated workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.task.outputs.repository }}
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: target-checkout
          persist-credentials: false

      - name: Execute bounded worker and export patch proposal only
        shell: bash
        env:
          TASK_FILE: ${{ steps.task.outputs.task_file }}
          MINI_SWE_AGENT_BIN: ${{ vars.MINI_SWE_AGENT_BIN }}
          MINI_SWE_AGENT_SANDBOX: ${{ vars.MINI_SWE_AGENT_SANDBOX }}
          MINI_SWE_AGENT_IMAGE: ${{ vars.MINI_SWE_AGENT_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p worker-artifacts
          python3 -m controller.worker_execution_bridge \
            --task-json "$TASK_FILE" \
            --checkout "$GITHUB_WORKSPACE/target-checkout" \
            --output-dir "$GITHUB_WORKSPACE/worker-artifacts" \
            --timeout $(( ${{ inputs.timeout_minutes }} * 60 )) \
            | tee worker-artifacts/worker-result.json

      - name: Upload patch proposal and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-worker-${{ steps.task.outputs.task_id || 'blocked' }}-${{ github.run_id }}
          path: worker-artifacts/
          if-no-files-found: warn
          retention-days: 7
