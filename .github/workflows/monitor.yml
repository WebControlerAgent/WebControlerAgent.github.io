name: Controller Monitor
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run controller
        run: |
          echo "Controller monitor started: $(date -u)"
          echo "Add authorized source/repository adapters under controller/."
          echo "No secrets are exposed to the public site."
