name: Controller Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: controller-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Run controller
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python3 controller/engine.py

      - name: Commit status and state
        run: |
          git config user.name "Web Controller Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/state.json public/status.json
          git diff --cached --quiet || git commit -m "chore: update controller status"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install

      - name: Build 3D workspace
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built workspace
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy built workspace
        id: deployment
        uses: actions/deploy-pages@v4
