name: External agent integration checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/external-agent-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/external-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    name: Playwright UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Run UI tests
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
